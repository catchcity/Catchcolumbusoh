name: Keep Supabase Alive

on:
  schedule:
    # Runs Mon, Wed, Fri at 8:00 AM UTC
    - cron: "0 8 * * 1,3,5"
  workflow_dispatch: # allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping site to keep Supabase active
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://catchcolumbusoh.vercel.app/)
          echo "Response status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Site is alive!"
          else
            echo "Warning: Site returned status $STATUS"
            exit 1
          fi
